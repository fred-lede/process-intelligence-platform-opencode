name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        settings:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            engine_args: ''
          # Intel runner on purpose: PyInstaller cannot cross-compile, so the
          # frozen engine inherits the runner's architecture. Building the
          # x86_64 bundle on an arm64 runner would ship an arm64 engine.
          - platform: 'macos-13'
            args: '--target x86_64-apple-darwin'
            engine_args: ''
          - platform: 'ubuntu-22.04'
            args: ''
            engine_args: ''
          # CPU / CUDA variants are only meaningful on Linux: xgboost declares
          # its `nvidia-*` CUDA dependencies with a Linux-only platform marker,
          # so on Windows and macOS there is nothing for --with-cuda to add.
          # productName is overridden so the two Linux artifacts do not collide
          # in the release; the app identifier is the same, so install one.
          - platform: 'ubuntu-22.04'
            args: '--config {"productName":"Process Intelligence Platform (CUDA)"}'
            engine_args: '-- --with-cuda'
          - platform: 'windows-latest'
            args: ''
            engine_args: ''
    runs-on: ${{ matrix.settings.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: install dependencies (ubuntu only)
        if: matrix.settings.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: install frontend dependencies
        run: npm ci

      - name: setup uv (frozen engine build)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: verify synchronized project version
        run: |
          npm run version:sync
          git diff --exit-code

      - name: build frozen analysis engine
        run: npm run engine:build ${{ matrix.settings.engine_args }}

      - name: verify frozen engine architecture (macOS)
        if: matrix.settings.platform == 'macos-latest' || matrix.settings.platform == 'macos-13'
        run: |
          set -euo pipefail
          exe="src-tauri/resources/engine/process-intelligence-engine"
          wanted="${{ contains(matrix.settings.args, 'aarch64') && 'arm64' || 'x86_64' }}"
          actual="$(lipo -archs "$exe")"
          echo "frozen engine arch=$actual wanted=$wanted"
          case "$actual" in
            *"$wanted"*) ;;
            *) echo "::error::frozen engine architecture ($actual) does not match the bundle target ($wanted)"; exit 1 ;;
          esac

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: build & release app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Process Intelligence Platform ${{ github.ref_name }}'
          releaseBody: 'See the assets to download and install this version.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.settings.args }}
