[project]
name = "process-intelligence-engine"
version = "0.2.0"
description = "Process Intelligence Platform - Python analysis engine"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas>=2.2.0",
    "polars>=1.0.0",
    "numpy>=1.26.0",
    "openpyxl>=3.1.0",
    "scipy>=1.12.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "shap>=0.45.0",
    "pyDOE2>=1.3.0",
    "gplearn>=0.4.2",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=process_intelligence_engine"
asyncio_mode = "auto"