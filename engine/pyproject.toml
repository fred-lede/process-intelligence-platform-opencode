[project]
name = "process-intelligence-engine"
version = "0.2.0"
description = "Process Intelligence Platform - Python analysis engine"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.2.0",
    "polars>=1.0.0",
    "numpy>=1.26.0",
    "openpyxl>=3.1.0",
    "scipy>=1.12.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "shap>=0.45.0",
    "pyDOE2>=1.3.0",
    "gplearn>=0.4.2",
    "jinja2>=3.1.0",
    # Imported at module scope by ai/ollama_client.py and ai/orchestrator.py:
    # the engine cannot start without it, so it is a hard runtime dependency.
    "aiohttp>=3.9.0",
    # PDF report export.
    "weasyprint>=60.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    # The Ollama client tests are async; without this plugin they fail with
    # "async def functions are not natively supported" instead of running.
    "pytest-asyncio>=0.23.0",
]
bundle = [
    # Build-only: freezes the engine into the standalone executable that the
    # Tauri bundle ships (see scripts/build-engine.mjs).
    "pyinstaller>=6.0",
]

[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=process_intelligence_engine"
asyncio_mode = "auto"
