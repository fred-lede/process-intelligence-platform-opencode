[project]
name = "process-intelligence-engine"
version = "0.2.0"
description = "Process Intelligence Platform - Python analysis engine"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "openpyxl>=3.1.0",
    "scipy>=1.12.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "shap>=0.45.0",
    "pyDOE2>=1.3.0",
    "gplearn>=0.4.2",
    "jinja2>=3.1.0",
    # Imported at module scope by ai/ollama_client.py and ai/orchestrator.py:
    # the engine cannot start without it, so it is a hard runtime dependency.
    "aiohttp>=3.9.0",
    # PDF report export.
    # Upper bound deliberate. WeasyPrint 70 emits a DeprecationWarning that HarfBuzz-Subset
    # "will be required by future versions", and libharfbuzz-subset is absent both from the
    # build machine and from the frozen bundle -- so a future release would break PDF export
    # in the packaged app with no change to our code. Raise this bound only after installing
    # libharfbuzz-subset0 and collecting it into the spec's binaries.
    "weasyprint>=60.0,<71",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    # The Ollama client tests are async; without this plugin they fail with
    # "async def functions are not natively supported" instead of running.
    "pytest-asyncio>=0.23.0",
]
bundle = [
    # Build-only: freezes the engine into the standalone executable that the
    # Tauri bundle ships (see scripts/build-engine.mjs).
    "pyinstaller>=6.0",
]
dl = [
    # The optional deep-learning stack behind the TFT ladder. It has to be declared here,
    # not installed ad hoc: `uv sync` makes the venv match the lockfile exactly and
    # uninstalls anything it does not know about, so a hand-installed torch is silently
    # deleted the next time the engine is built. build:cuda syncs this extra.
    #
    # torch and torchvision are redirected to the CUDA index below, because the PyPI
    # wheels are CPU-only on Windows (PyPI ships CUDA wheels for Linux only, since
    # PyTorch 2.11), which would make a "CUDA" build silently CPU-only. pytorch-forecasting
    # stays on PyPI and pulls in lightning and torchmetrics transitively.
    "torch>=2.7",
    "torchvision>=0.22",
    "pytorch-forecasting>=1.8",
]

# Torch is installed from PyTorch's CUDA index rather than PyPI. To target a different
# CUDA variant, change the URL below and re-lock (`uv lock --project engine`); cu128 is
# the conservative choice for hosts whose driver predates CUDA 13 (R580), and note that
# cu118 cannot run Blackwell (sm_120) at all.
[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu132"
# Only resolve the packages that name this index below, so every other dependency still
# comes from PyPI.
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cuda" }
torchvision = { index = "pytorch-cuda" }

[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=process_intelligence_engine"
asyncio_mode = "auto"
